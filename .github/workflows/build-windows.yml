name: Build SquallowTweaks for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        run: |
          Write-Host "=== Dateien im Repository (Tiefe 3) ==="
          Get-ChildItem -Recurse -File -Depth 3 |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
            ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }
          $skip = '[\\/](\.git|venv|\.venv|build|dist|__pycache__)[\\/]'
          $main = Get-ChildItem -Recurse -File -Filter main.py |
                  Where-Object { $_.FullName -notmatch $skip } |
                  Where-Object { Test-Path (Join-Path $_.DirectoryName 'requirements.txt') } |
                  Select-Object -First 1
          if (-not $main) { throw "Kein Ordner mit main.py UND requirements.txt gefunden. Siehe Dateiliste oben." }
          Write-Host "PROJECT_DIR = $($main.DirectoryName)"
          "PROJECT_DIR=$($main.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python syntax
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Syntaxfehler gefunden." }

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m unittest discover -s tests -v

      - name: UI smoke test (mock, darf nicht den Build blockieren)
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: python tests/smoke_ui.py

      # PresentMon (Intel, MIT-Lizenz) fuer die FPS-Messung mitliefern. Schlaegt der Download fehl, wird ohne gebaut.
      - name: Fetch PresentMon (optional)
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/GameTechDev/PresentMon/releases/latest" -Headers @{ "User-Agent" = "squallow-build" }
          $asset = $rel.assets | Where-Object { $_.name -match '^PresentMon.*x64.*\.exe$' } | Select-Object -First 1
          if (-not $asset) { Write-Warning "Kein PresentMon-Konsolen-Asset gefunden; Build ohne PresentMon."; exit 0 }
          Write-Host "Lade $($asset.name) ($($rel.tag_name))"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile PresentMon.exe
          if ((Get-Item PresentMon.exe).Length -lt 100000) { Remove-Item PresentMon.exe; throw "PresentMon-Download unvollstaendig." }
          "HAS_PM=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable EXE
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $pi = @(
            '--noconfirm','--clean','--onefile','--windowed','--uac-admin',
            '--name','SquallowTweaks',
            '--icon','assets/squallow.ico',
            '--add-data','assets;assets',
            '--collect-all','customtkinter',
            '--collect-submodules','pages',
            '--hidden-import','restorepoint','--hidden-import','cleaner','--hidden-import','netlab','--hidden-import','fnmon',
            '--hidden-import','bench','--hidden-import','monitor','--hidden-import','procs','--hidden-import','texts'
          )
          if ($env:HAS_PM -eq 'true' -and (Test-Path 'PresentMon.exe')) { $pi += @('--add-binary','PresentMon.exe;.') }
          $pi += 'main.py'
          python -m PyInstaller @pi
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller ist fehlgeschlagen." }
          if (-not (Test-Path "dist/SquallowTweaks.exe")) { throw "dist/SquallowTweaks.exe wurde nicht erstellt." }
          Get-Item dist/SquallowTweaks.exe | Format-List Name, Length

      - name: Self-test built EXE
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $p = Start-Process -FilePath "dist/SquallowTweaks.exe" -ArgumentList "--selftest" -Wait -PassThru
          $report = Join-Path $env:LOCALAPPDATA "SquallowTweaks/selftest.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "EXE-Selbsttest fehlgeschlagen (Exitcode $($p.ExitCode))." }

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SquallowTweaks-Windows-EXE
          path: ${{ env.PROJECT_DIR }}/dist/SquallowTweaks.exe
          if-no-files-found: error
          retention-days: 14
